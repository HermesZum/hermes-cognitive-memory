[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-cognitive-memory"
version = "1.4.0"
description = "Cognitive memory provider for Hermes Agent — neuroscience-inspired decay, reconsolidation, dedup, conflict supersession, and source-confidence erosion."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []  # Uses only stdlib (sqlite3)

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
packages = ["cognitive_memory"]